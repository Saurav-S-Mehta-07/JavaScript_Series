<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body style="background-color: black; color: white;">
    <ul class = "language">
        <li>JavaScript</li>
    </ul>
</body>
<script>
    function addList(languageName){
        const li = document.createElement("li");
        li.innerHTML = `${languageName}`
        document.querySelector(".language").
        appendChild(li);
    }

    addList("python");
    addList("TypeScript");

    function addOptList(languageName){
        const li = document.createElement("li");
        li.appendChild(document.createTextNode(languageName))
        document.querySelector(".language").appendChild(li)
    }

    addOptList("go")


    // edit
    const second_lang  = document.querySelector("li:nth-child(2)")
    // second_lang.innerHTML = "Mojo"
    const newli = document.createElement("li");
    newli.textContent = "Mojo";
    second_lang.replaceWith(newli);
    
    const first_lang = document.querySelector("li:nth-child(1)")
    const newli1 = document.createElement("li");
    newli1.textContent = "Java";
    first_lang.replaceWith(newli1);

    //remove
    const deleteLi = document.querySelector("li:nth-child(1)")
    // deleteLi.remove()

    const ul = document.querySelector(".language");
    ul.removeChild(deleteLi)


</script>
</html>
