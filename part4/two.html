<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body style="background-color: black; color:  white;">
    
</body>
<script>
    const div = document.createElement("div");
    console.log(div)
    div.className = "container"
    div.id = Math.round((Math.random() * 10) + 1)
    div.setAttribute("title", "generated title")
    div.style.color = "green"
    div.style.padding = "12px"
    div.style.border = "1px solid pink"
    div.style.borderRadius  = "20px"

    // div.innerText = "I'm a Created Div by Document"
    const addText = document.createTextNode("I'm a Created Div by Document");
    div.appendChild(addText);

    let color = 1;
    function addNewPara(text = "Hi! User"){
        const p = document.createElement("p");
        p.innerText = `Para : ${text}`;
        p.style.color = color?"white":"red";
        color = !color;
        div.appendChild(p);
    }
    
    addNewPara("you are good");
    addNewPara("awesome")
    addNewPara()
    addNewPara("I'm a new para")

    document.querySelector("body").appendChild(div)

</script>
</html>
