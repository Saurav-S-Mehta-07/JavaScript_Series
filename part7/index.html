<script>

      const reqUrl = "https://api.github.com/users/Saurav-S-Mehta-07"
    async function getCatFact() {

    // getCatFact();

    const xhr = new XMLHttpRequest();
    xhr.open("GET", reqUrl);
    xhr.onreadystatechange = function(){
        // console.log(xhr.readyState);
        if(xhr.readyState === 4){
            const data = JSON.parse(this.responseText);
            document.write(`<img style = "height=100px; width=100px;" src = ${data.avatar_url}>`)
            document.write("follower : ", data.followers)
        }
    }
    xhr.send();

</script>
